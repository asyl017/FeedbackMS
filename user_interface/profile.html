<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .alert {
            padding: 20px;
            background-color: #31980c;
            color: white;
            margin-bottom: 15px;
            display: none;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .feedback-list {
            margin-top: 20px;
            text-align: left;
        }
        .feedback-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .feedback-item button {
            background-color: #f44336;
            margin-top: 10px;
        }
        .feedback-item button:hover {
            background-color: #d32f2f;
        }
        /* Modal styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 50%;
            top: 10%;
            transform: translate(-50%, -10%);
            width: 300px; /* Fixed width */
            background-color: #00f048; /* Red background */
            color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }
        .modal-content {
            margin: 0;
            padding: 0;
            border: none;
        }
        .close {
            color: white;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Profile</h1>
        <div id="profile-info">
            <!-- Profile information will be dynamically inserted here -->
        </div>
        <button id="logoutButton">Log out</button>
        <div class="feedback-list" id="feedback-list">
            <h2>Your Feedbacks</h2>
            <!-- User feedbacks will be dynamically inserted here -->
        </div>
    </div>

    <!-- The Modal -->
    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="notificationMessage"></p>
        </div>
    </div>

    <script>
        async function fetchProfile() {
            const response = await fetch('/api/profile');

            if (response.ok) {
                const profile = await response.json();
                document.getElementById('profile-info').innerHTML = `
                    <p><strong>Username:</strong> ${profile.username}</p>
                    <p><strong>Email:</strong> ${profile.email}</p>
                `;
            } else {
                showNotification('Error fetching profile information');
            }
        }

        async function fetchUserFeedbacks() {
            const response = await fetch('/api/user-feedbacks');

            if (response.ok) {
                const feedbacks = await response.json();
                const feedbackList = document.getElementById('feedback-list');
                feedbackList.innerHTML = '<h2>Your Feedbacks</h2>'; // Clear existing feedbacks

                feedbacks.forEach(feedback => {
                    const feedbackItem = document.createElement('div');
                    feedbackItem.className = 'feedback-item';
                    feedbackItem.innerHTML = `
                        <p><strong>Restaurant:</strong> ${feedback.restaurant}</p>
                        <p><strong>Rating:</strong> ${feedback.rating}</p>
                        <p><strong>Comment:</strong> ${feedback.comment}</p>
                        <button onclick="deleteFeedback('${feedback._id}')">Delete</button>
                    `;
                    feedbackList.appendChild(feedbackItem);
                });
            } else {
                showNotification('Error fetching user feedbacks');
            }
        }

        async function deleteFeedback(feedbackId) {
            const response = await fetch(`/api/feedbacks/${feedbackId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showNotification('Feedback deleted successfully');
                fetchUserFeedbacks(); // Refresh the feedback list
            } else {
                showNotification('Error deleting feedback');
            }
        }

        document.getElementById('logoutButton').addEventListener('click', () => {
            fetch('/api/logout', {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    window.location.href = '/login'; // Перенаправляем на страницу логина после выхода
                } else {
                    showNotification('Error logging out');
                }
            });
        });

        // Get the modal
        var modal = document.getElementById("notificationModal");

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function showNotification(message) {
            const notificationMessage = document.getElementById('notificationMessage');
            notificationMessage.textContent = message;
            modal.style.display = "block";
        }

        fetchProfile();
        fetchUserFeedbacks();
    </script>
</body>
</html>
