<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            background-color: #333;
            padding: 10px;
        }
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            padding: 20px;
        }
        .alert {
            padding: 20px;
            background-color: #f44336;
            color: white;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <div id="profile-section">
            <!-- Profile or Login/Register will be dynamically inserted here -->
        </div>
    </div>

    <div class="container">
        <h1>Search and Filter Restaurants</h1>

        <div>
            <label for="type">Restaurant Type:</label>
            <select id="type">
                <option value="">All</option>
                <option value="Italian">Italian</option>
                <option value="Turkish">Turkish</option>
            </select>

            <label for="price">Average Bill:</label>
            <input type="range" id="price" min="0" max="100" step="10" />
            <span id="price-value">0</span>

            <button onclick="filterRestaurants()">Filter</button>
        </div>

        <h2>Restaurant List</h2>
        <div id="restaurant-list">
            <!-- Restaurant items will be populated dynamically here -->
        </div>
    </div>

    <script>
        document.getElementById('price').addEventListener('input', function() {
            document.getElementById('price-value').textContent = this.value;
        });

        function filterRestaurants() {
            const type = document.getElementById('type').value;
            const price = document.getElementById('price').value;

            fetch(`/api/restaurants?type=${type}&price=${price}`)
                .then(response => response.json())
                .then(data => {
                    const restaurantList = document.getElementById('restaurant-list');
                    restaurantList.innerHTML = '';  // Clear current list
                    data.forEach(restaurant => {
                        const div = document.createElement('div');
                        div.innerHTML = `
                            <strong>${restaurant.name}</strong> <br>
                            <strong>Type:</strong> ${restaurant.type} <br>
                            <strong>Average Bill:</strong> $${restaurant.averageBill} <br><br>
                        `;
                        restaurantList.appendChild(div);
                    });
                });
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('profile-section').innerHTML = `
                    <a href="#" onclick="redirectToProfile()">Profile</a>
                `;
            } else {
                document.getElementById('profile-section').innerHTML = `
                    <a href="/login">Login</a>
                `;
            }
        }

        function redirectToProfile() {
            const token = localStorage.getItem('token');
            if (token) {
                fetch('/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/profile';
                    } else {
                        alert('Error accessing profile');
                    }
                });
            } else {
                window.location.href = '/login';
            }
        }

        checkAuth();
    </script>
</body>
</html>
